name: Frequent cron (manual fallback)

# The 15-minute schedule now runs as a native Vercel cron (see vercel.json),
# which the Pro plan supports - more reliable than GitHub Actions (no 60-day
# auto-pause, no cross-host/redirect auth pitfalls). This workflow is kept only
# as a manual fallback to fire /api/cron/frequent on demand, e.g. to test or to
# catch up after an outage.
#
# Setup (only for the manual run): a repository secret named CRON_SECRET
# matching the deployment's CRON_SECRET. Optionally a repository variable
# CRON_BASE_URL to override the default host below.

on:
  workflow_dispatch: {}

# Don't pile up overlapping runs if one is slow or GitHub batches delayed ticks.
concurrency:
  group: frequent-cron
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit /api/cron/frequent
        env:
          # Canonical host on purpose: the apex redirects to www, and a
          # cross-host redirect drops the Authorization header.
          BASE_URL: ${{ vars.CRON_BASE_URL || 'https://www.elochaser.com' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET repository secret is not set."
            exit 1
          fi
          code=$(curl -sS --max-time 60 -o /tmp/body.txt -w "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$BASE_URL/api/cron/frequent")
          echo "HTTP $code"
          cat /tmp/body.txt
          echo
          if [ "$code" != "200" ]; then
            echo "::error::Expected HTTP 200, got $code"
            exit 1
          fi
